<body>
  <header>
    <img src="images/logo.svg" alt="Site Logo" width="60" height="60" loading="lazy" />
    <span>Room Ready</span>

  </header>

  <nav id="navbar">
    <ul>
      <li>
        <a href="#">
          <img src="images/nav-supplies.svg" alt="">
          <div>Supplies</div>
        </a>
      </li>
      <li class="active">
        <a href="index.html">
          <img src="images/nav-calculator.svg" alt="">
          <div>Calculator</div>
        </a>
      </li>
      <li>
        <a href="#">
          <img src="images/nav-color.svg" alt="">
          <div>Find Colors</div>
        </a>
      </li>
      <li>
        <a href="#">
          <img src="images/nav-pros.svg" alt="">
          <div>For Pros</div>
        </a>
      </li>
    </ul>
  </nav>
  <main>
    <h1>Supply Calculator</h1>
    <img class="hero" src="images/hero.png" alt="Paint supplies, carpet and a measuring tape">
    <section id="signup" class="signup">
      <form>
        <label>
          Room Width <input type="number" id="width" class="input" placeholder="feet" required>
        </label>
        <label>
          Room Depth <input type="number" id="depth" class="input" placeholder="feet" required>
        </label>
        <label>
          Wall Height <input type="number" id="height" class="input" placeholder="feet" required>
        </label>

        <label>Paint Quality
          <select id="quality" required>
            <option value="" disabled selected>Select an Oprion</option>
            <option value="600">Premium (600sqft per gallon)</option>
            <option value="500">Standard (500sqft per gallon)</option>
            <option value="400">Cheap (400sqft per gallon)</option>
          </select>
        </label>
        <input class="button" type="button" value="Calculate Supplies">
      </form>
    </section>

    <section id="display" class="display">
      <div></div>
    </section>
  </main>

  <footer>
    <div class="social">
      <a href="https://github.com/HugoWang-Kimochi" target="_blank"><img src="images/icon-github.svg" alt="GitHub Icon"
          width="16" height="16" /></a>

    </div>
